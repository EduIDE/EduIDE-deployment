gateway:
  name: theia-shared-gateway
  namespace: gateway-system
  className: envoy
  labels: {}
  annotations: {}

  # Optional static addresses (if supported by your Gateway controller).
  # addresses:
  #   - 131.159.88.21
  addresses: []

  allowedRoutes:
    namespaces:
      from: All

  # Each listener needs:
  # - name
  # - protocol (`HTTPS` by default, `HTTP` for ACME challenge listeners)
  # - port (defaults to 443 for HTTPS, 80 for HTTP)
  # - hostname
  # - tlsSecretName (required for HTTPS listeners)
  listeners: []

gatewayClass:
  create: false
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  labels: {}
  annotations: {}
  parametersRef: {}

envoyProxy:
  create: false
  name: theia-shared-gateway
  namespace: envoy-gateway-system
  labels: {}
  annotations: {}
  spec: {}

managedCertificates:
  enabled: false
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  certificates: []

gatewayAcmeIssuer:
  enabled: false
  name: letsencrypt-prod-gateway
  email: ""
  privateKeySecretName: letsencrypt-prod-gateway-priv-key
  server: https://acme-v02.api.letsencrypt.org/directory
  serviceType: ClusterIP

wildcardTLSSecret:
  create: false
  name: static-theia-cert
  namespace: gateway-system
  certificate: ""
  key: ""
