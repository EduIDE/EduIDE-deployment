{{- if and .Values.configure.enabled .Values.configure.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gitea-eduide.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitea-eduide.labels" . | nindent 4 }}
  annotations:
    # Create early and keep it: the Job hook needs it, and other resources may
    # want the produced Secret on later syncs.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gitea-eduide.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitea-eduide.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  # `create` cannot be scoped by resourceNames, so it is a separate rule.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Reading/modifying is restricted to the single OAuth secret this chart manages.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.eduide.oauthSecretName }}"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gitea-eduide.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitea-eduide.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gitea-eduide.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gitea-eduide.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
