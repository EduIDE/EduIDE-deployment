# Reusable: deploy one environment.
#
# Replaces deploy-theia.yml. Differences that matter:
#
#   - the environment is described by environments/<name>/env.yaml, not by
#     GitHub Environment variables, so a change is reviewable in a diff
#   - the cluster is asserted against the kubeconfig before anything is applied
#   - the pending change is shown as a helm diff before it is applied
#   - --wait --atomic, so a green job means a healthy rollout
#   - the summary is read from the cluster afterwards, not echoed from inputs
#   - nothing cluster-scoped is installed here; see bootstrap-cluster.yml
#
# Two stacks, chosen per environment by spec.platform.stack (default java):
#   java  chart eduide 2.x (Theia Cloud), values on top of environments/_base.yaml
#   go    chart eduide 3.x (Go control plane), values on top of environments/_base-go.yaml
# Steps that exist for only one of them say so in their name or condition.
#
# Preloading is a separate release deliberately. It pulls ~10 multi-GB images
# on every node, so including it under --wait would time out and --atomic would
# then roll back a perfectly healthy deploy.

name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
        description: "Name under environments/"
      chart_version:
        type: string
        default: ""
        description: "Overrides spec.platform.chartVersion"
      image_overrides:
        type: string
        default: "{}"
        description: 'JSON, e.g. {"controlPlane":"pr-451"}. Never sets a tag for images that do not exist.'
      clean_install:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false
        description: "Render and diff, apply nothing"

permissions:
  contents: read

jobs:
  # runs-on is evaluated before a job can read a file, so the runner label has
  # to be resolved from the cluster manifest in a job of its own.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.r.outputs.runner }}
      cluster: ${{ steps.r.outputs.cluster }}
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - id: r
        run: |
          set -euo pipefail
          M="environments/${{ inputs.environment }}/env.yaml"
          [[ -f "$M" ]] || { echo "::error::no such environment: ${{ inputs.environment }}"; exit 1; }
          C=$(yq -r '.spec.cluster' "$M")
          [[ -f "clusters/$C.yaml" ]] || { echo "::error::unknown cluster: $C"; exit 1; }
          {
            echo "cluster=$C"
            echo "runner=$(yq -r '.spec.runner // "ubuntu-latest"' "clusters/$C.yaml")"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    runs-on: ${{ needs.resolve.outputs.runner }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.url.outputs.url }}
    concurrency:
      # One deploy at a time per environment. Never cancel in progress: a
      # half-applied Helm release is worse than a queued one.
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      KUBECONFIG: ${{ github.workspace }}/kubeconfig
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - uses: azure/setup-kubectl@v4

      - name: Install helm-diff and yq
        run: |
          set -euo pipefail
          # Pinned: helm-diff's newer releases declare `platformHooks`, which the
          # pinned helm v3.16.3 cannot parse, so the plugin fails to load and the
          # preview quietly renders nothing at all.
          helm plugin install https://github.com/databus23/helm-diff --version v3.9.11 >/dev/null 2>&1 || true
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Resolve the environment manifest
        id: env
        run: |
          set -euo pipefail
          M="environments/${{ inputs.environment }}/env.yaml"
          [[ -f "$M" ]] || { echo "::error::no such environment: ${{ inputs.environment }}"; exit 1; }
          {
            echo "cluster=$(yq -r '.spec.cluster' "$M")"
            echo "namespace=$(yq -r '.spec.namespace' "$M")"
            echo "tier=$(yq -r '.metadata.tier' "$M")"
            echo "channel=$(yq -r '.spec.platform.channel' "$M")"
            stack="$(yq -r '.spec.platform.stack // "java"' "$M")"
            echo "stack=$stack"
            V="environments/${{ inputs.environment }}/values.yaml"
            if [[ "$stack" == "go" ]]; then
              # The service host also serves the landing page.
              echo "landing=$(yq -r '.["eduide-control-plane"].config.hosts.service' "$V")"
            else
              echo "landing=$(yq -r '.hosts.configuration | .landing + "." + .baseHost' "$V")"
            fi
            v="${{ inputs.chart_version }}"
              if [[ -z "$v" ]]; then v="$(yq -r '.spec.platform.chartVersion' "$M")"; fi
            echo "chart_version=$v"
          } >> "$GITHUB_OUTPUT"

      - name: Cluster defaults (go)
        if: ${{ steps.env.outputs.stack == 'go' }}
        run: |
          set -euo pipefail
          # The same cluster properties as for java, under the keys the Go
          # chart reads. An environment must not set them itself.
          C="clusters/${{ steps.env.outputs.cluster }}.yaml"
          SC=$(yq -r '.spec.storageClassName // ""' "$C")
          GW=$(yq -r '.spec.gatewayClassName // ""' "$C")
          EMAIL=$(yq -r '.spec.acmeEmail // ""' "$C")
          for v in "$SC" "$GW" "$EMAIL"; do
            [[ -n "$v" ]] || { echo "::error::${C} needs spec.storageClassName, spec.gatewayClassName and spec.acmeEmail for a go environment"; exit 1; }
          done
          NS=$(yq -o=json -I=0 '.spec.nodeSelector // {}' "$C")
          # The pool label is the key of the selector; none means every node.
          POOL=$(yq -r '(.spec.nodeSelector // {}) | keys | .[0] // ""' "$C")
          {
            echo "gateway:"
            echo "  className: ${GW}"
            echo "issuer:"
            echo "  acme:"
            echo "    email: ${EMAIL}"
            echo "eduide-control-plane:"
            echo "  config:"
            echo "    workspaces:"
            echo "      storageClassName: ${SC}"
            echo "    placement:"
            echo "      nodeSelector: ${NS}"
            if [[ -n "$POOL" ]]; then echo "      nodePoolLabel: ${POOL}"; fi
            # The usage archive keeps the paper data on its own volume; same
            # class and pool as everything else of the environment.
            echo "  usageArchive:"
            echo "    persistence:"
            echo "      storageClassName: ${SC}"
            echo "    nodeSelector: ${NS}"
          } > cluster-defaults.yaml
          cat cluster-defaults.yaml

      - name: Cluster defaults (java)
        if: ${{ steps.env.outputs.stack == 'java' }}
        run: |
          set -euo pipefail
          # Storage class is a property of the cluster, not of the environment,
          # so it is stated once in clusters/<name>.yaml. An environment that
          # sets its own is rejected by test-deploy-logic.sh. On the test
          # cluster BOTH csi-rbd-sc and longhorn exist and both are marked
          # default, so a PVC that names no class gets an arbitrary one; test3
          # ran on longhorn and the rest on csi-rbd-sc for no recorded reason.
          # Naming it explicitly is what makes that deterministic.
          C="clusters/${{ steps.env.outputs.cluster }}.yaml"
          SC=$(yq -r '.spec.storageClassName' "$C")
          [[ -n "$SC" && "$SC" != "null" ]] || { echo "::error::${C} has no spec.storageClassName"; exit 1; }
          # Two subcharts claim storage independently. theia-shared-cache's
          # vendored reposilite chart has its own key and defaults to
          # csi-rbd-sc, so setting only the operator's would leave a PVC that
          # never binds on a cluster that does not offer that class.
          # The node pool is a cluster property too. global.nodeSelector pins
          # every workload from chart 2.8.0 on; preloading.nodeSelector is set
          # as well because charts 2.6.0 to 2.7.x read only that one. The shared
          # cache is not pinned; it is off everywhere. JSON is valid YAML, and {} renders no nodeSelector, so a
          # cluster without a pool stays as it is.
          NS=$(yq -o=json -I=0 '.spec.nodeSelector // {}' "$C")
          cat > cluster-defaults.yaml <<EOF
          operator:
            storageClassName: ${SC}
          eduide-shared-cache:
            reposilite:
              persistence:
                storageClass: ${SC}
          global:
            nodeSelector: ${NS}
          preloading:
            nodeSelector: ${NS}
          EOF
          echo "storageClassName: ${SC}"
          echo "nodeSelector: ${NS}"

      - name: Set up kubeconfig
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$KUBECONFIG"
          printf '%s' '${{ secrets.KUBECONFIG }}' > "$KUBECONFIG"
          kubectl version --client >/dev/null

      - name: Assert we are pointed at the right cluster
        run: |
          set -euo pipefail
          CLUSTER="${{ steps.env.outputs.cluster }}"
          # The cluster tells us which one it is. Bootstrap stamped this, so
          # nobody transcribes an identifier and there is nothing to keep in
          # sync. Comparing the API server URL would not work here: every
          # cluster sits behind the same Rancher endpoint, so that URL is
          # identical for all of them and a comparison would always pass.
          FOUND=$(kubectl -n eduide-system get configmap eduide-cluster-identity \
                    -o jsonpath='{.data.clusterName}' 2>/dev/null || true)
          if [[ -z "$FOUND" ]]; then
            echo "::error::this cluster carries no identity, so it has not been bootstrapped."
            echo "::error::Run the 'Bootstrap cluster' workflow for '${CLUSTER}' first."
            exit 1
          fi
          if [[ "$FOUND" != "$CLUSTER" ]]; then
            echo "::error::environment '${{ inputs.environment }}' targets cluster '${CLUSTER}',"
            echo "::error::but this KUBECONFIG reaches a cluster that calls itself '${FOUND}'."
            echo "::error::Refusing to deploy. Check the KUBECONFIG secret on this GitHub Environment."
            exit 1
          fi
          echo "cluster '${CLUSTER}' confirmed"
          kubectl get nodes -o name | wc -l | xargs echo "nodes:"

      - name: Verify the cluster has been bootstrapped
        run: |
          set -euo pipefail
          if [[ "${{ steps.env.outputs.stack }}" == "go" ]]; then
            if ! kubectl get crd idetemplates.eduide.github.io >/dev/null 2>&1; then
              echo "::error::IDETemplate CRD not present. Run the Bootstrap cluster workflow for ${{ steps.env.outputs.cluster }} (it installs eduide-control-plane-crds), or install that chart by hand."
              exit 1
            fi
          elif ! kubectl get crd appdefinitions.theia.cloud >/dev/null 2>&1; then
            echo "::error::AppDefinition CRD not present. Run the Bootstrap cluster workflow for ${{ steps.env.outputs.cluster }} first."
            exit 1
          fi

      - name: Resolve image overrides
        id: images
        run: |
          set -euo pipefail
          # A PR only builds the images of the repo it came from, so an
          # override names one source repository. The chart carries one version
          # knob per repository, so this is a straight mapping rather than a
          # list of image strings that has to know every repository name.
          # Never set a blanket tag: it would point every image at a tag that
          # mostly does not exist.
          : > image-args.txt
          cp="$(jq -r '.controlPlane // empty' <<<'${{ inputs.image_overrides }}')"
          ide="$(jq -r '.ide // empty' <<<'${{ inputs.image_overrides }}')"
          lp="$(jq -r '.landingPage // empty' <<<'${{ inputs.image_overrides }}')"
          # if-blocks, not `A && B`: under set -e a trailing false test would
          # fail the step when no override is given, which is the common case.
          # One token per line. `mapfile` makes each line a single array element,
          # so writing "--set versions.ide=latest" as one line hands helm one
          # argument containing a space and it dies with
          # `unknown flag: --set versions.ide`. The flag and its value have to
          # be separate elements.
          if [[ "${{ steps.env.outputs.stack }}" == "go" ]]; then
            # Go chart: one knob per source repository, as for java.
            if [[ -n "$cp"  ]]; then printf '%s\n' --set "eduide-control-plane.image.tag=${cp}"   >> image-args.txt; fi
            if [[ -n "$ide" ]]; then printf '%s\n' --set "images.tag=${ide}"                     >> image-args.txt; fi
            if [[ -n "$lp"  ]]; then printf '%s\n' --set "eduide-landing-page.image.tag=${lp}"   >> image-args.txt; fi
          else
            if [[ -n "$cp"  ]]; then printf '%s\n' --set "versions.cloud=${cp}"       >> image-args.txt; fi
            if [[ -n "$ide" ]]; then printf '%s\n' --set "versions.ide=${ide}"        >> image-args.txt; fi
            if [[ -n "$lp"  ]]; then printf '%s\n' --set "versions.landingPage=${lp}" >> image-args.txt; fi
          fi
          if [[ -s image-args.txt ]]; then
            echo "::notice::image overrides: $(tr '\n' ' ' < image-args.txt)"
          fi

      - name: Secrets file (java)
        if: ${{ steps.env.outputs.stack == 'java' }}
        run: |
          set -euo pipefail
          # A values file, not --set: --set puts secrets in the process list and
          # in Actions debug logs.
          install -m 600 /dev/null secrets.yaml
          cat > secrets.yaml <<EOF
          keycloak:
            cookieSecret: "${{ secrets.THEIA_KEYCLOAK_COOKIE_SECRET }}"
          service:
            adminApiToken: "$(printf '%s' '${{ secrets.THEIA_ADMIN_API_TOKEN }}' | base64 | tr -d '\n')"
          EOF

      - name: Values files
        run: |
          set -euo pipefail
          # One file per line, like image-args.txt, so helm gets each -f and
          # its path as separate arguments.
          if [[ "${{ steps.env.outputs.stack }}" == "go" ]]; then
            printf '%s\n' -f cluster-defaults.yaml -f environments/_base-go.yaml \
              -f "environments/${{ inputs.environment }}/values.yaml" > values-args.txt
          else
            printf '%s\n' -f cluster-defaults.yaml -f environments/_base.yaml \
              -f "environments/${{ inputs.environment }}/values.yaml" -f secrets.yaml > values-args.txt
          fi

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          # The chart is published, not vendored. helm resolves its own
          # dependencies from the same registry when it pulls.
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Preview the change
        run: |
          set -euo pipefail
          mapfile -t IMG < image-args.txt || true
          mapfile -t VALS < values-args.txt
          helm diff upgrade eduide oci://ghcr.io/eduide/charts/eduide \
            --namespace "${{ steps.env.outputs.namespace }}" \
            --version "${{ steps.env.outputs.chart_version }}" \
            "${VALS[@]}" "${IMG[@]}" \
            --allow-unreleased --no-color > helm.diff 2>&1 || true
          {
            echo "<details><summary>Pending change (helm diff)</summary>"
            echo ""
            echo '```diff'
            head -c 50000 helm.diff
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Purge before a clean install
        if: ${{ inputs.clean_install && !inputs.dry_run }}
        run: |
          set -euo pipefail
          NS="${{ steps.env.outputs.namespace }}"
          case "$NS" in
            ""|default|kube-system|kube-public|kube-node-lease)
              echo "::error::refusing to purge namespace '$NS'"; exit 1 ;;
          esac
          if [[ "${{ steps.env.outputs.tier }}" == "production" ]]; then
            echo "::error::clean_install is not permitted for a production environment"; exit 1
          fi
          if [[ "${{ steps.env.outputs.stack }}" == "go" ]]; then
            kubectl -n "$NS" delete idesessions.eduide.github.io,ideworkspaces.eduide.github.io --all --ignore-not-found
            kubectl -n "$NS" delete idepools.eduide.github.io,idetemplates.eduide.github.io --all --ignore-not-found
          else
            kubectl -n "$NS" delete sessions.theia.cloud,workspaces.theia.cloud --all --ignore-not-found
            kubectl -n "$NS" delete appdefinitions.theia.cloud --all --ignore-not-found
          fi
          kubectl -n "$NS" delete deploy,daemonset,statefulset --all --ignore-not-found
          kubectl -n "$NS" wait --for=delete pod --all --timeout=120s || true
          kubectl -n "$NS" delete pvc --all --ignore-not-found

      - name: OIDC client secret (go)
        if: ${{ steps.env.outputs.stack == 'go' && !inputs.dry_run }}
        env:
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # The control plane chart only names this Secret, so it has to exist
          # before helm runs. Piped through apply and never echoed: the value
          # stays out of the log and the process list.
          if [[ -z "${OIDC_CLIENT_SECRET:-}" ]]; then
            echo "::error::OIDC_CLIENT_SECRET is not set on the '${{ inputs.environment }}' GitHub Environment."
            echo "::error::It is the client secret of the confidential gateway client (gatewayClientID) in Keycloak."
            exit 1
          fi
          NS="${{ steps.env.outputs.namespace }}"
          # Get before create: a kubeconfig scoped to the namespace may read it but not patch it.
          if ! kubectl get namespace "$NS" >/dev/null 2>&1; then
            kubectl create namespace "$NS"
          fi
          # shellcheck disable=SC2016
          NAME=$(yq eval-all '. as $i ireduce ({}; . * $i) | .["eduide-control-plane"].oidc.clientSecretName' \
                   environments/_base-go.yaml "environments/${{ inputs.environment }}/values.yaml")
          [[ -n "$NAME" && "$NAME" != "null" ]] || { echo "::error::no eduide-control-plane.oidc.clientSecretName in the values"; exit 1; }
          kubectl -n "$NS" create secret generic "$NAME" \
            --from-literal=client-secret="$OIDC_CLIENT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f - >/dev/null
          echo "secret ${NAME} applied in ${NS}"

      - name: Deploy
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          mapfile -t IMG < image-args.txt || true
          # Not --create-namespace: helm 3 then creates the namespace even when
          # it exists, which a kubeconfig scoped to that namespace may not do.
          # Getting it is allowed; creating it is only needed the first time.
          NS="${{ steps.env.outputs.namespace }}"
          if ! kubectl get namespace "$NS" >/dev/null 2>&1; then
            kubectl create namespace "$NS"
          fi
          mapfile -t VALS < values-args.txt
          helm upgrade --install eduide oci://ghcr.io/eduide/charts/eduide \
            --namespace "$NS" \
            --version "${{ steps.env.outputs.chart_version }}" \
            "${VALS[@]}" "${IMG[@]}" \
            --wait --atomic --timeout 15m

      - name: Force a pull when the tag is floating
        if: ${{ !inputs.dry_run && steps.env.outputs.stack == 'java' && steps.env.outputs.channel == 'main' }}
        run: |
          set -euo pipefail
          NS="${{ steps.env.outputs.namespace }}"
          kubectl -n "$NS" rollout restart deploy/operator-deployment deploy/service-deployment deploy/landing-page-deployment 2>/dev/null || true
          kubectl -n "$NS" rollout status deploy/operator-deployment --timeout=5m || true

      - name: Check the control plane boards (go)
        if: ${{ !inputs.dry_run && steps.env.outputs.stack == 'go' }}
        env:
          CHART_VERSION: ${{ steps.env.outputs.chart_version }}
          CLUSTER_NAME: ${{ steps.env.outputs.cluster }}
        run: |
          # Only a hint: the boards belong to Bootstrap cluster, and this
          # deploy's credentials may not even read cattle-dashboards.
          # Bootstrap derives the boards from the pinned chartVersion of the
          # environments, so a chart_version override is not seen by it.
          fix="run Bootstrap cluster for ${CLUSTER_NAME} (if this deploy overrode chart_version, pin it in env.yaml first)"
          want=""
          if meta=$(helm show chart oci://ghcr.io/eduide/charts/eduide --version "$CHART_VERSION" 2>/dev/null); then
            want=$(yq -r '.dependencies[] | select(.name == "eduide-control-plane") | .version' <<< "$meta" || true)
          fi
          if [[ -z "$want" ]]; then
            echo "::notice::could not read the control plane version of the deployed chart; boards not checked"
            exit 0
          fi
          if ! out=$(kubectl -n cattle-dashboards get configmap eduide-go-control-plane-dashboards \
                -o jsonpath='{.metadata.annotations.eduide\.github\.io/source}' 2>board.err); then
            out=$(cat board.err)
            if [[ "$out" == *NotFound* ]]; then
              echo "::warning::no control plane boards on cluster ${CLUSTER_NAME} (deployed control plane ${want}); ${fix}"
            else
              echo "::notice::could not read the control plane boards (${out}); boards not checked"
            fi
            exit 0
          fi
          have="${out##* }"
          # "~" sorts before the release in sort -V, so 0.3.0-rc.1 ranks below 0.3.0.
          if [[ -z "$have" || "$(printf '%s\n%s\n' "${have/-/\~}" "${want/-/\~}" | sort -V | tail -1)" != "${have/-/\~}" ]]; then
            echo "::warning::control plane boards are ${have:-of unknown version}, deployed control plane is ${want}; ${fix}"
          else
            echo "control plane boards ${have} cover ${want}"
          fi

      - id: url
        run: echo "url=https://${{ steps.env.outputs.landing }}" >> "$GITHUB_OUTPUT"

      - name: What is live
        if: ${{ always() && !inputs.dry_run }}
        run: |
          ./scripts/live-summary.sh \
            "${{ steps.env.outputs.namespace }}" \
            "${{ inputs.environment }}" \
            "${{ steps.env.outputs.cluster }}" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Service health
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.env.outputs.stack }}" == "go" ]]; then
            # Public status of the Go service, no token needed. 200 means the
            # service is up; the body says which parts (sign-in, workspaces) are not.
            URL="https://${{ steps.env.outputs.landing }}/api/v1/status"
            for _ in $(seq 1 12); do
              code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || echo 000)
              if [[ "$code" == "200" ]]; then echo "$URL -> 200 (service reachable)"; exit 0; fi
              sleep 10
            done
            echo "::warning::$URL answered ${code:-nothing} within two minutes; expected 200"
            exit 0
          fi
          # The service has no /health endpoint - that probe returned 404 on
          # every environment and warned on every deploy. /service is the real
          # endpoint; it only accepts POST, so a GET returning 405 is the proof
          # that the pod is up and the route resolves. 200 would do too.
          URL="https://service.${{ steps.env.outputs.landing }}/service"
          for _ in $(seq 1 12); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || echo 000)
            case "$code" in
              200|405) echo "$URL -> $code (service reachable)"; exit 0 ;;
            esac
            sleep 10
          done
          echo "::warning::$URL answered ${code:-nothing} within two minutes; expected 200 or 405"

  # Every deploy of the e2e environment ends with the functional suite, whichever
  # workflow started it (deploy-e2e or deploy-dispatch), so a
  # green deploy of e2e always means a tested rollout. Other environments are
  # tested by hand, see docs/environments.md.
  e2e-tests:
    needs: deploy
    if: ${{ inputs.environment == 'e2e.eduide.student.k8s.aet.cit.tum.de' && !inputs.dry_run }}
    uses: EduIDE/theia-scale-tests/.github/workflows/functional-tests.yml@main
    with:
      environment: ${{ inputs.environment }}
    # Repository secrets, not secrets of the e2e GitHub Environment: a job that
    # calls a reusable workflow cannot select an environment, so environment
    # secrets would arrive empty.
    secrets:
      KEYCLOAK_USER: ${{ secrets.E2E_KEYCLOAK_USER }}
      KEYCLOAK_PWD: ${{ secrets.E2E_KEYCLOAK_PWD }}
