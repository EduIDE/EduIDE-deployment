name: Validate environments

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same version the deploy workflows pin. test-deploy-logic.sh renders
      # every environment against the chart, and without helm on PATH it
      # skipped that silently - the job went green having rendered nothing.
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install tools
        env:
          # renovate: datasource=github-releases depName=mikefarah/yq
          YQ_VERSION: v4.44.3
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          pipx install check-jsonschema

      - name: Schema-validate clusters and environments
        run: |
          set -euo pipefail
          fail=0
          for f in clusters/*.yaml; do
            yq -o=json "$f" > /tmp/c.json
            if check-jsonschema --schemafile schemas/cluster.schema.json /tmp/c.json; then
              echo "  OK   $f"
            else
              echo "::error file=$f::does not match cluster schema"; fail=1
            fi
          done
          for f in environments/*/env.yaml; do
            yq -o=json "$f" > /tmp/e.json
            if check-jsonschema --schemafile schemas/environment.schema.json /tmp/e.json; then
              echo "  OK   $f"
            else
              echo "::error file=$f::does not match environment schema"; fail=1
            fi
          done
          exit $fail

      - name: Every environment references a cluster that exists
        run: |
          set -euo pipefail
          fail=0
          for f in environments/*/env.yaml; do
            c=$(yq -r '.spec.cluster' "$f")
            if [[ ! -f "clusters/$c.yaml" ]]; then
              echo "::error file=$f::references unknown cluster '$c'"
              fail=1
            fi
          done
          exit $fail

      - name: Gateway listener prefixes are unique per cluster
        run: |
          set -euo pipefail
          # Two environments on one cluster sharing a listener prefix would
          # attach to the same Gateway sections and fight over them.
          fail=0
          for cluster in $(yq -r '.metadata.name' clusters/*.yaml); do
            dupes=$(for f in environments/*/env.yaml; do
              [[ "$(yq -r '.spec.cluster' "$f")" == "$cluster" ]] || continue
              env=$(basename "$(dirname "$f")")
              yq -r '[.gateway.parentRefs[]?.sectionName | sub("-(landing|service|instances|webview)$"; "")] | unique | .[]' "environments/$env/values.yaml" 
            done | sort | uniq -d)
            if [[ -n "$dupes" ]]; then
              echo "::error::cluster $cluster has duplicate gateway listener prefixes: $dupes"
              fail=1
            fi
          done
          exit $fail

      - name: AGENTS.md does not reference missing paths
        run: ./scripts/check-agents-md.sh

      # The script skips its render checks when the chart cannot be pulled, so
      # that it still runs on a laptop with no helm. In CI an unreachable chart
      # is a failure, not a skip, or the render coverage disappears without
      # anything turning red.
      # Every version any environment selects, not one environment's. A bump
      # reaches staging and production before the test environments, so reading
      # test1's version meant the chart a production manifest asked for was the
      # one thing never checked.
      - name: Chart every environment renders against is reachable
        run: |
          set -euo pipefail
          fail=0
          # Read each file on its own: yq separates multiple documents with ---,
          # which would otherwise come back as a version to look up.
          versions="$(for f in environments/*/env.yaml; do yq -r '.spec.platform.chartVersion' "$f"; done | sort -u)"
          for version in $versions; do
            if helm show chart oci://ghcr.io/eduide/charts/eduide --version "$version" >/dev/null 2>&1; then
              echo "chart $version is published"
            else
              echo "::error::chart $version is not published; no environment can deploy it"
              fail=1
            fi
          done
          exit $fail

      - name: Deploy logic tests
        run: ./scripts/test-deploy-logic.sh

      - name: Every environment has a values file and it parses
        run: |
          set -euo pipefail
          fail=0
          for f in environments/*/env.yaml; do
            env=$(basename "$(dirname "$f")")
            v="environments/$env/values.yaml"
            if [[ ! -f "$v" ]]; then
              echo "::error::$env has no values.yaml"; fail=1; continue
            fi
            if ! yq -e '.' "$v" >/dev/null 2>&1; then
              echo "::error file=$v::is not valid YAML"; fail=1; continue
            fi
            echo "  OK   $env"
          done
          exit $fail
