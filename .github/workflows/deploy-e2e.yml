# Deploy the e2e-test environment from main. deploy.yml then runs the
# functional tests against it, as it does after every e2e deploy.
#
# The environment exists so the suite has somewhere to run that nobody is using.
# Running it against a shared test environment means a red build might only mean
# a colleague was mid-experiment, which is how a suite stops being trusted.
#
# Only the functional tests run here. Load and benchmark runs stay manual: they
# start real IDE sessions and take long enough that nobody would wait for them
# on a merge.

name: Deploy e2e and test

on:
  push:
    branches: [main]
    paths:
      - 'environments/**'
      - 'clusters/**'
      - 'charts/**'
      - 'scripts/**'
      - '.github/workflows/deploy*.yml'
  repository_dispatch:
    types: [component-main-updated]
  workflow_dispatch:

# Deploy and tests together, one run at a time: a second merge must not roll
# out while the first one's tests still run against the same host. Only the
# newest waiting run is kept, which is what an environment following main wants.
concurrency:
  group: deploy-e2e-and-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tags:
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.j.outputs.json }}
    steps:
      - id: j
        env:
          SHA: ${{ github.event.client_payload.sha }}
          COMPONENT: ${{ github.event.client_payload.component }}
        run: |
          set -euo pipefail
          if [[ -z "${SHA:-}" || -z "${COMPONENT:-}" ]]; then
            echo 'json={}' >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$COMPONENT" in
            EduIDE-control-plane|EduIDE-Cloud) key=controlPlane ;;
            EduIDE)              key=ide ;;
            EduIDE-Landing-Page) key=landingPage ;;
            *)
              echo "::warning::unknown component '${COMPONENT}'"
              echo 'json={}' >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "json=$(jq -cn --arg k "$key" --arg v "latest-${SHA:0:7}" '{($k): $v}')" >> "$GITHUB_OUTPUT"

  deploy:
    needs: tags
    uses: ./.github/workflows/deploy.yml
    with:
      environment: e2e.eduide.student.k8s.aet.cit.tum.de
      image_overrides: ${{ needs.tags.outputs.json }}
    secrets: inherit

  report:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "### e2e-test"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Deploy and functional tests | ${{ needs.deploy.result }} |"
            echo ""
            echo "deploy.yml runs the functional suite after every e2e deploy; its e2e-tests job says whether the rollout or the tests failed."
          } >> "$GITHUB_STEP_SUMMARY"
