# Staging follows main.
#
# Triggered by a push here, or by a repository_dispatch from a component repo
# when its main moves. The component sends its commit SHA so staging runs an
# immutable latest-<sha> tag rather than a floating one.
#
# That detail is load-bearing: with a floating tag the pod template never
# changes between upgrades, so `helm --wait` sees no diff and returns
# immediately without anything being pulled, and --atomic has nothing to roll
# back if the new image is broken.

name: Deploy staging

on:
  push:
    branches: [main]
    paths:
      - 'environments/**'
      - 'clusters/**'
      - 'charts/**'
      - 'scripts/**'
      - '.github/workflows/deploy*.yml'
  repository_dispatch:
    types: [component-main-updated]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tags:
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.j.outputs.json }}
    steps:
      - id: j
        env:
          SHA: ${{ github.event.client_payload.sha }}
          COMPONENT: ${{ github.event.client_payload.component }}
        run: |
          set -euo pipefail
          if [[ -z "${SHA:-}" || -z "${COMPONENT:-}" ]]; then
            echo 'json={}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$COMPONENT" in
            EduIDE-Cloud)        key=controlPlane ;;
            EduIDE)              key=ide ;;
            EduIDE-Landing-Page) key=landingPage ;;
            *)
              echo "::warning::unknown component '${COMPONENT}', deploying without an override"
              echo 'json={}' >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "json=$(jq -cn --arg k "$key" --arg v "latest-${SHA:0:7}" '{($k): $v}')" >> "$GITHUB_OUTPUT"

  deploy:
    needs: tags
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image_overrides: ${{ needs.tags.outputs.json }}
    secrets: inherit
