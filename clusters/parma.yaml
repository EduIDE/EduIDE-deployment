apiVersion: eduide.dev/v1
kind: Cluster
metadata:
  name: parma
  displayName: Parma cluster (no environment currently targets this)
spec:
  # NO ENVIRONMENT TARGETS THIS CLUSTER.
  #
  # Kept because the name appears in the old configuration and the cluster may
  # well exist; delete this file if it does not.
  #
  # test3 used to carry the comment "Test3 runs on the parma cluster", which is
  # why this manifest was written. The evidence says otherwise:
  # deployments/shared-gateway/values.yaml - the Gateway on aet-stud - defines
  # the test3-landing/-service/-instances/-webview listeners, and test3 attaches
  # to them by sectionName. An HTTPRoute can only attach to a Gateway in its own
  # cluster, so test3 is on aet-stud. Its longhorn storage class is now an
  # environment-level override.
  apiServerUrl: ""
  storageClassName: longhorn
  gatewayClassName: envoy
  sharedGateway:
    namespace: gateway-system
    name: theia-shared-gateway
  runner: ubuntu-latest
  bootstrapEnvironment: cluster-parma
