apiVersion: eduide.dev/v1
kind: Cluster
metadata:
  name: eduide
  displayName: EduIDE cluster (installations outside TUM)
spec:
  # NOT YET PROVISIONED. Environments targeting this cluster exist so their
  # configuration can be reviewed, but deploying one stops at the cluster
  # identity check until this is filled in and a KUBECONFIG secret exists.
  #
  #   ./scripts/cluster-url.sh ~/.kube/eduide.yaml
  apiServerUrl: ""

  # Carried over from the TUM clusters as a starting point; confirm once the
  # cluster exists. An environment can override it in spec.values.
  storageClassName: csi-rbd-sc
  gatewayClassName: envoy

  sharedGateway:
    namespace: gateway-system
    name: theia-shared-gateway

  runner: ubuntu-latest
  bootstrapEnvironment: cluster-eduide
