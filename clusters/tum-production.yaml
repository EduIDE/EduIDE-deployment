apiVersion: eduide.dev/v1
kind: Cluster
metadata:
  name: tum-production
  displayName: TUM production cluster
spec:
  storageClassName: csi-rbd-sc
  gatewayClassName: envoy

  # cert-manager issues one certificate per role here, so each listener
  # references its own secret. Carried over verbatim from the hand-written
  # shared-gateway-prod values.
  tls:
    landing: landing-page-cert-secret
    service: service-cert-secret
    instances: ws-cert-secret
    webview: static-theia-cert
    # HTTP-01 challenges arrive on plain :80, so every host that cert-manager
    # renews needs an HTTP listener alongside its HTTPS one. Dropping these
    # does not break anything until a certificate comes up for renewal.
    acmeHttp: true

  sharedGateway:
    namespace: eduide-system
    name: theia-shared-gateway

  # This cluster runs its own GatewayClass and EnvoyProxy with a MetalLB
  # address, and issues certificates through letsencrypt-prod-gateway, unlike
  # the test cluster where the wildcard secrets are managed by hand.
  loadBalancerIP: 131.159.88.82

  runner: ubuntu-latest
  bootstrapEnvironment: cluster-tum-production
