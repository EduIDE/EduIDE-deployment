apiVersion: eduide.dev/v1
kind: Cluster
metadata:
  name: tum-production
  displayName: TUM production cluster
spec:
  storageClassName: csi-rbd-sc
  gatewayClassName: envoy

  sharedGateway:
    namespace: gateway-system
    name: theia-shared-gateway

  # This cluster runs its own GatewayClass and EnvoyProxy with a MetalLB
  # address, and issues certificates through letsencrypt-prod-gateway, unlike
  # the test cluster where the wildcard secrets are managed by hand.
  loadBalancerIP: 131.159.88.82

  runner: ubuntu-latest
  bootstrapEnvironment: cluster-tum-production
