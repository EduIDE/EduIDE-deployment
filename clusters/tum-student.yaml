apiVersion: eduide.dev/v1
kind: Cluster
metadata:
  name: tum-student
  displayName: TUM student cluster (test, staging and e2e)
spec:
  storageClassName: csi-rbd-sc
  gatewayClassName: envoy

  sharedGateway:
    namespace: eduide-system
    name: theia-shared-gateway

  # Deploying needs to reach the API server, unlike building. Per-cluster
  # because the three clusters differ in how they are reachable.
  runner: ubuntu-latest

  bootstrapEnvironment: cluster-tum-student
