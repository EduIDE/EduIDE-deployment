apiVersion: eduide.dev/v1
kind: Cluster
metadata:
  name: tum-student
  displayName: TUM student cluster (test, staging and e2e)
spec:
  storageClassName: csi-rbd-sc
  gatewayClassName: envoy

  # TLS secrets the shared Gateway's listeners reference. Per cluster because
  # the two clusters issue certificates differently: this one terminates
  # everything with one shared certificate, production has cert-manager issue
  # one per role. Bootstrap stamps these onto the listeners it derives.
  #
  # The webview secret is separate everywhere: those hosts are two labels below
  # the instance host, so no certificate that covers the others covers them.
  tls:
    landing: shared-theia-cert
    service: shared-theia-cert
    instances: shared-theia-cert
    webview: static-theia-cert
    # cert-manager solves HTTP-01 challenges over plain :80, so every host it
    # renews needs an HTTP listener alongside its HTTPS one. Confirmed against
    # the live cluster, which carries acme-*-http listeners per environment.
    acmeHttp: true

  # Contact address on the ACME account. Required because acmeHttp is true:
  # bootstrap creates the ClusterIssuer that the derived certificates point at,
  # rather than assuming a suitable one already exists. The `letsencrypt-prod`
  # issuer on these clusters solves over nginx Ingress only, so it cannot
  # answer a Gateway API challenge.
  acmeEmail: admin.aet@xcit.tum.de

  sharedGateway:
    namespace: eduide-system
    name: theia-shared-gateway

  # Deploying needs to reach the API server, unlike building. Per-cluster
  # because the three clusters differ in how they are reachable.
  runner: ubuntu-latest

  bootstrapEnvironment: cluster-tum-student

  # Scrape cert-manager so certificates can be alerted on before they lapse.
  # cert-manager exports expiry but ships no ServiceMonitor, so nothing watches
  # it by default. The webview wildcard is renewed by hand once a year.
  monitorCertManager: true

  # Where alerts go. The channel list is here; the webhook URLs are not - they
  # are credentials and live in this cluster's GitHub Environment as
  # ALERT_WEBHOOKS, a JSON object keyed by each channel's `secretKey`. One
  # object rather than one secret per channel, so a cluster can hold a
  # different webhook per installation without editing the workflow.
  #
  # `minSeverity` is what reaches the channels, not what fires. Everything below
  # it still fires and is visible in Alertmanager and on the dashboards; it just
  # does not page anyone. See docs/monitoring-setup.md.
  alerting:
    enabled: false
    minSeverity: warning
    channels: []
