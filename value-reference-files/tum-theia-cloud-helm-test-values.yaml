hosts:
  configuration:
    &hostsConfig # This is a YAML anchor for reusability and readability
    baseHost: artemis.cit.tum.de
    service: service.theia-test
    landing: theia-test
    instance: instance.theia-test

theia-certificates:
  hosts:
    configuration: *hostsConfig

eduide-shared-cache:
  enabled: true
  auth:
    enabled: false

  cache:
    maxEntrySizeMB: 100
    verifyCASHash: true

  staticAnalysis:
    enabled: true
    checkNetwork: true
    checkExec: true
    checkReflection: true
    checkFilesystem: true

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  monitoring:
    enabled: true

  reposilite:
    fullnameOverride: eduide-shared-cache-reposilite

  gateway:
    enabled: true
    parentRefs:
      cache:
        - name: theia-shared-gateway
          namespace: gateway-system
          sectionName: <env>-cache
      repo:
        - name: theia-shared-gateway
          namespace: gateway-system
          sectionName: <env>-repo
    cache:
      hostname: cache.<env>.theia-test.artemis.cit.tum.de
    repo:
      hostname: repo.<env>.theia-test.artemis.cit.tum.de


theia-cloud:
  app:
    id: nJV3nKZmpxTD4wu2
    name: Theia Cloud

  issuer:
    email: ls1.itg@in.tum.de

  hosts:
    configuration: *hostsConfig
    allWildcardInstances: ["*.webview."]

  gateway:
    enabled: true
    create: true
    routes:
      enabled: true
    className: envoy
    name: theia-cloud-gateway
    parentRefs: []
    instancesWildcardSecretNames: { "*.webview.": static-theia-cert }
    serviceRouteRequestTimeout: "60s"

  monitor:
    enable: true
    activityTracker:
      enable: true
      interval: 3

  operator:
    image: ghcr.io/eduide/eduide-cloud/operator:pr-22
    sentry:
      enable: true
    eagerStart: false
    replicas: 1
    sessionsPerUser: 10
    storageClassName: csi-rbd-sc
    buildCache:
      enabled: true
      gradleUrl: "https://cache.<env>.theia-test.artemis.cit.tum.de/gradle/"
      bazelUrl: "https://cache.<env>.theia-test.artemis.cit.tum.de/bazel/"
      enablePush: true
    dependencyCache:
      enabled: true
      url: "https://repo.<env>.theia-test.artemis.cit.tum.de/releases/"

  service:
    image: ghcr.io/eduide/eduide-cloud/service:pr-22
    sentry:
      enable: true
    adminApiTokenSecret:
      name: service-admin-api-token
      key: ADMIN_API_TOKEN

  preloading:
    images:
      - ghcr.io/eduide/eduidec-landing-page:latest
      - ghcr.io/eduide/eduide/java-17:latest
      - ghcr.io/eduide/eduide/java-17-templates:latest
      - ghcr.io/eduide/eduide/c:latest
      - ghcr.io/eduide/eduide/javascript:latest
      - ghcr.io/eduide/eduide/ocaml:latest
      - ghcr.io/eduide/eduide/rust:latest
      - ghcr.io/eduide/eduide/python:latest

  imagePullPolicy: Always

  # Do not install demoApplication
  demoApplication:
    install: false

  landingPage:
    # We use the try now page as landing page since the default does not support mutliple apps -> https://github.com/eclipsesource/theia-cloud/discussions/301
    image: ghcr.io/eduide/eduidec-landing-page
    sentry:
      enable: true
    # We can define a default blueprint
    appDefinition: "java-17-templates-latest"
    ephemeralStorage: false
    additionalApps:
      java-17-templates-latest:
        label: Java 17
        buildSystems:
          - id: maven
            label: Maven
          - id: gradle
            label: Gradle
      c-latest:
        label: C
      javascript-latest:
        label: Javascript
      ocaml-latest:
        label: Ocaml
      python-latest:
        label: Python
      rust-latest:
        label: Rust
    infoTitle: "Welcome to Theia - your tailor-made online IDE"
    infoText: "We are offering a online programming environment perfectly fitting for your project, please log in to continue."
    loadingText: "Preparing your personal Online IDE..."
    footerLinks:
      attribution:
        text: "Built by TUM LS1 Team 👨‍💻"
        url: "https://aet.cit.tum.de/"
        version: "Test2-v1.0.0"
      bugReport:
        text: "Report a bug 🐛"
        url: "https://github.com/ls1intum/theia-cloud/issues"
      featureRequest:
        text: "Request a feature ✨"
        url: "https://github.com/ls1intum/theia-cloud/issues"
      about:
        text: "About"
        url: "https://ase-website-test.ase.cit.tum.de/"


  keycloak:
    enable: true
    # -- Key cloak auth URL. Only has to be specified when enable: true
    authUrl: "https://keycloak.aet.cit.tum.de/"
