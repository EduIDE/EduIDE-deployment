apiVersion: eduide.dev/v1
kind: Environment
metadata:
  name: test2
  displayName: Artemis Online IDE (Test2)
  tier: test
spec:
  cluster: aet-stud
  namespace: test2

  platform:
    chartVersion: 1.0.0-rc0
    channel: main

  hosts:
    baseHost: theia-test.artemis.cit.tum.de
    landing: test2
    wildcardPrefixes: ["*.webview."]

  gateway:
    mode: shared
    listenerPrefix: test2

  keycloak:
    realm: Test
    clientId: theia-test

  branding:
    appName: Artemis Online IDE (Test2)
    infoTitle: Welcome to EduIDE Cloud (Test2)
    footerVersion: Test2-v1.0.0
