# PREPARED values for tum-production on the Go control plane (EduIDE 3.x).
#
# Nothing reads this file yet: env.yaml still says stack java and the deploy
# uses values.yaml. To switch, follow docs/rollout-3.0-tum-production.md, which
# ends with: set stack go and chartVersion 3.x in env.yaml and replace
# values.yaml with this file.
#
# Storage class (longhorn), node pool (aet.cit.tum.de/pool: pve), Gateway class
# (envoy) and the ACME contact come from clusters/tum-production.yaml.

x-hosts: &hosts
  service: eduide.artemis.cit.tum.de
  instance: instance.eduide.artemis.cit.tum.de
  webview: webview.instance.eduide.artemis.cit.tum.de

x-gateway: &gateway
  name: eduide
  namespace: eduide-tum-production
  sectionName: ""
  # Only the HTTPS listeners: sessions and pages are never served on the ACME :80 listeners.
  port: 443

x-keycloak: &keycloak
  url: https://keycloak.aet.cit.tum.de/
  realm: tum
  clientId: eduide

# Artemis sends the repository URL with the student's VCS token (Artemis#14702).
templateDefaults:
  gitUriAllowCredentials: true

# The artemis editions are launched from Artemis and are not listed on the
# landing page; the standalone editions are what a student picks there. The
# apps are the ones Artemis production launches today.
templates:
  # Warm pools like today's minInstances (java-17 and java-25: 3). The cap is
  # idle plus claimed instances of the pool, so it bounds a whole exam.
  java-17:
    pool: {minIdle: 3, maxInstances: 200}
  java-25:
    pool: {minIdle: 3, maxInstances: 200}
  c: {}
  javascript: {}
  python: {}
  java-17-standalone: {}
  java-25-standalone: {}
  c-standalone: {}
  javascript-standalone: {}
  python-standalone: {}

eduide-control-plane:
  service:
    # As operator.replicas on 2.x.
    replicas: 3
  config:
    deployment: tum-production
    hosts: *hosts
    gateway: *gateway
    # As on 2.x, where sessionsPerUser was 10.
    sessionsPerUser: 10
    oidc:
      issuerURL: https://keycloak.aet.cit.tum.de/realms/tum
      clientIDs: [eduide]
      gatewayClientID: eduide
    allowedHosts:
    - github.com
    - gitlab.com
    - codeberg.org
    # The hosts Artemis puts in repository URLs and ARTEMIS_URL.
    - artemis.cit.tum.de
    - artemis.tum.de
    placement:
      prepull: {enabled: true}
  networkPolicy:
    monitoringNamespace: cattle-monitoring-system
    # AET's pod and service CIDRs (198.18.0.0/16, 198.19.0.0/16) and 131.159.88.0/24 (nodes, load
    # balancers, API server). Artemis (131.159.89.175) stays reachable.
    sessionEgressExtraDeny: [131.159.88.0/24, 198.18.0.0/15]
  monitoring:
    podMonitor: {enabled: true}
    rules: {enabled: true, extraLabels: {namespace: eduide-system}}
    # The dashboard ConfigMap would go to cattle-dashboards, outside the namespace the deploy
    # credentials may write. It belongs to bootstrap (follow-up); off until then.
    dashboard: {enabled: false}
  oidc:
    authorizationEndpoint: https://keycloak.aet.cit.tum.de/realms/tum/protocol/openid-connect/auth
    tokenEndpoint: https://keycloak.aet.cit.tum.de/realms/tum/protocol/openid-connect/token
    endSessionEndpoint: https://keycloak.aet.cit.tum.de/realms/tum/protocol/openid-connect/logout

eduide-landing-page:
  host: eduide.artemis.cit.tum.de
  gateway: *gateway
  config:
    title: Artemis Online IDE
    keycloak: *keycloak
  legal:
    imprint:
      markdown: |
        # Imprint

        Technische Universität München (TUM)
        Boltzmannstrasse 3, 85748 Garching

        Responsible: Prof. Dr. Stephan Krusche

        Contact: support.aet@xcit.tum.de
    privacy:
      markdown: |
        # Privacy

        Controller: Technische Universität München (TUM), represented by
        Prof. Dr. Stephan Krusche, Boltzmannstrasse 3, 85748 Garching,
        support.aet@xcit.tum.de.

        Data protection officer: datenschutz(at)tum.de.

        Anonymised usage data from this installation is evaluated for research.
