apiVersion: eduide.dev/v1
kind: Environment
metadata:
  name: test1
  displayName: EduIDE Test 1
  tier: test
spec:
  # Which cluster this lands on. Reviewable in a diff, and asserted against the
  # kubeconfig at deploy time.
  cluster: tum-student
  namespace: test1

  platform:
    # The chart version is the platform version. For test environments this
    # tracks whatever is current; production pins a release.
    chartVersion: 1.0.0-rc0
    channel: main

  hosts:
    baseHost: theia-test.artemis.cit.tum.de
    landing: test1
    # service/instance default to service.<landing> and instance.<landing>.
    wildcardPrefixes: ["*.webview."]

  gateway:
    mode: shared
    # Derives the four sectionNames: test1-landing/-service/-instances/-webview.
    listenerPrefix: test1

  keycloak:
    realm: Test
    clientId: theia-test

  branding:
    appName: Artemis Online IDE (Test1)
    infoTitle: Welcome to EduIDE Cloud (Test1)
    footerVersion: Test1-v1.0.0

  # Free-form escape hatch, merged last over everything else.
  values:
    theia-cloud:
      operator:
        # Deliberately high: test1 is where load tests run.
        sessionsPerUser: 1000
