# Helm values for the bonn environment, on the Go control plane (EduIDE 3.x).
#
# A plain values file. The deploy runs:
#   helm upgrade --install eduide ... -f cluster-defaults.yaml \
#     -f environments/_base-go.yaml -f this file
#
# Storage class, node pool, Gateway class and the ACME contact come from
# clusters/eduide.yaml. Deployment metadata is in env.yaml next door. The old
# Java values (Theia Cloud, 2.7.3) are in git history only.

x-hosts: &hosts
  service: bonn.eduide.aet.cit.tum.de
  instance: instance.bonn.eduide.aet.cit.tum.de
  webview: webview.instance.bonn.eduide.aet.cit.tum.de

x-gateway: &gateway
  name: eduide
  namespace: eduide-bonn
  sectionName: ""
  # Only the HTTPS listeners: sessions and pages are never served on the ACME :80 listeners.
  port: 443

x-keycloak: &keycloak
  url: https://keycloak.aet.cit.tum.de/
  realm: external_register
  clientId: eduide

# Bonn offers JavaScript only, as the standalone edition. Saved workspaces are
# the point of this installation: the template allows only a volume, so every
# session has one. A workspace that persists cannot start from a warm pool (a
# volume cannot be mounted into a running pod), so there is no pool and a
# session always starts cold.
templates:
  javascript-standalone:
    persistence: {allowed: [volume], default: volume}
    # More generous than the 2.x defaults, as before. Idle is the 3 hours Bonn
    # had (timeout: 180 minutes); max stays at the 24h chart default.
    timeouts: {idle: 180m, warning: 170m, max: 24h}
    resources:
      limits: {cpu: "4", memory: 3000M}

eduide-control-plane:
  config:
    deployment: bonn
    hosts: *hosts
    gateway: *gateway
    # As on 2.x, where sessionsPerUser was 10.
    sessionsPerUser: 10
    oidc:
      # TUM's Keycloak with the realm for non-TUM users, same as Mannheim.
      issuerURL: https://keycloak.aet.cit.tum.de/realms/external_register
      clientIDs: [eduide]
      gatewayClientID: eduide
    allowedHosts:
    - github.com
    - gitlab.com
    - codeberg.org
    workspaces:
      # Reap a workspace 90 days after its last session (2.x: 14 days).
      retention: 2160h
    placement:
      # Pulls the IDE and agent images onto the node ahead of the first start.
      prepull: {enabled: true}
  networkPolicy:
    monitoringNamespace: cattle-monitoring-system
    # parma uses public address ranges inside the cluster: its own address, pods 198.18.0.0/16
    # and services 198.19.0.0/16. Sessions have no business reaching any of them.
    sessionEgressExtraDeny: [131.159.88.106/32, 198.18.0.0/16, 198.19.0.0/16]
  monitoring:
    podMonitor: {enabled: true}
    # The AlertmanagerConfig in eduide-system routes on this namespace (docs/monitoring-setup.md).
    rules: {enabled: true, extraLabels: {namespace: eduide-system}}
    # The dashboard ConfigMap would go to cattle-dashboards, outside the namespace the deploy
    # credentials may write. It belongs to bootstrap (follow-up); off until then.
    dashboard: {enabled: false}
  oidc:
    # Set, so Envoy Gateway does not discover them through the OIDC upstream.
    authorizationEndpoint: https://keycloak.aet.cit.tum.de/realms/external_register/protocol/openid-connect/auth
    tokenEndpoint: https://keycloak.aet.cit.tum.de/realms/external_register/protocol/openid-connect/token
    endSessionEndpoint: https://keycloak.aet.cit.tum.de/realms/external_register/protocol/openid-connect/logout

eduide-landing-page:
  host: bonn.eduide.aet.cit.tum.de
  gateway: *gateway
  config:
    title: EduIDE Bonn
    keycloak: *keycloak
  # Texts the chart requires. Controller and contact are the TUM ones every
  # installation here has used since 2.x.
  legal:
    imprint:
      markdown: |
        # Imprint

        Technische Universität München (TUM)
        Boltzmannstrasse 3, 85748 Garching

        Responsible: Prof. Dr. Stephan Krusche

        Contact: support.aet@xcit.tum.de
    privacy:
      markdown: |
        # Privacy

        Controller: Technische Universität München (TUM), represented by
        Prof. Dr. Stephan Krusche, Boltzmannstrasse 3, 85748 Garching,
        support.aet@xcit.tum.de.

        Data protection officer: datenschutz(at)tum.de.

        EduIDE stores your files in a personal workspace. The workspace expires
        90 days after your last session and is deleted one day later. Anonymised usage data from this
        installation is evaluated for research.
