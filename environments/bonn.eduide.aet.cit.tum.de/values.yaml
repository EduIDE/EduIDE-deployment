# Helm values for the bonn environment.
#
# A plain values file. The deploy runs:
#   helm upgrade --install eduide ... -f environments/_base.yaml -f this file
#
# _base.yaml carries what is identical everywhere; this file carries what is
# not. Anything appearing here for more than one environment belongs in
# _base.yaml instead.
#
# Deployment metadata - which cluster, which namespace, which chart version -
# is in env.yaml next door, because it configures the deploy rather than the
# chart.
# The Gradle/Maven dependency cache is not deployed here. The operator's
# enableBuildCaching and enableDependencyCaching are false in every
# environment, so no session ever reached it - on a production installation
# that is a Redis, a cache server and a 20Gi reposilite PVC serving nobody.
# The chart declares it with `condition: eduide-shared-cache.enabled`, so the
# one key switches off the subchart, its vendored reposilite and the PVC.

app:
  name: EduIDE Bonn
gateway:
  parentRefs:
  - name: theia-shared-gateway
    namespace: eduide-system
    sectionName: bonn-landing
  - name: theia-shared-gateway
    namespace: eduide-system
    sectionName: bonn-service
  - name: theia-shared-gateway
    namespace: eduide-system
    sectionName: bonn-instances
  - name: theia-shared-gateway
    namespace: eduide-system
    sectionName: bonn-webview
landingPage:
  # Workspaces persist here, so a launch must not be ephemeral. The chart-wide
  # default in _base.yaml is `true`, which would throw the volume away with the
  # session.
  ephemeralStorage: false
  # No trustedArtemisHosts until this installation's Artemis server is known,
  # so its links still need a Launch click.
  privacy:
    # Anonymised usage data from this installation is evaluated for research.
    # A processing purpose rather than a preference, so it is stated only on the
    # production installations that have a basis for it, not on test or staging.
    scientificUse: true
  appDefinition: javascript
  infoTitle: Welcome to EduIDE (Bonn)
hosts:
  # --- hostnames served by this installation (checked by test-deploy-logic.sh)
  #   bonn.eduide.aet.cit.tum.de                      landing page
  #   service.bonn.eduide.aet.cit.tum.de              REST service
  #   instance.bonn.eduide.aet.cit.tum.de             session ingress
  #   *.webview.instance.bonn.eduide.aet.cit.tum.de   session webviews
  # --- end hostnames
  configuration:
    baseHost: eduide.aet.cit.tum.de
    service: service.bonn
    landing: bonn
    instance: instance.bonn
  allWildcardInstances:
  - '*.webview.'
# Sessions start on demand here, not from the warm pool. A prewarmed instance
# never mounts the workspace PVC - only the lazy session handler does - so
# with eagerStart every file lived in the pod and was gone once the pod was
# recycled: after the inactivity timeout, the 3 hour session timeout, or an
# image update. The price is a slower first start. Switching also needs the
# warm pool removed by hand: docs/environments.md, "Switching an environment
# to lazy start".
operator:
  eagerStart: false
# Same server and realm as Mannheim: TUM's Keycloak with the realm for
# non-TUM users. The trailing slash on authUrl is load-bearing - the templates
# append `realms/<realm>` straight onto it.
#
# cookieSecret is not here. It comes from the GitHub Environment secret
# THEIA_KEYCLOAK_COOKIE_SECRET, which the deploy appends as its own values
# file. clientSecret stays at the chart's dummy because the client is public.
keycloak:
  enable: true
  authUrl: https://keycloak.aet.cit.tum.de/
  realm: external_register
  clientId: eduide
eduide-shared-cache:
  enabled: false

# ---------------------------------------------------------------------------
# Applications
# ---------------------------------------------------------------------------
# Bonn offers Javascript only. `enabled` is what limits that - leaving it empty
# renders the whole catalog and preloads every image onto the node.
appDefinitions:
  enabled:
    - javascript
  # Overrides the chart defaults (2 CPU, 2400M, 24h) for this installation.
  # These render from values on every deploy, unlike minInstances which is read
  # back from the live resource.
  defaults:
    limitsCpu: "4"
    limitsMemory: 3000M
    # Minutes. 3 hours.
    timeout: 180
  apps:
    # Removes the AppDefinition that the pre-2.7.0 name created, so the rename
    # does not leave two of them side by side.
    javascript-latest: null
    javascript:
      # Thirty sessions kept warm. Takes effect only once operator.eagerStart
      # is true, which it is not - see the warm pool note above. Also only a
      # bootstrap default: the chart reads the live value back on every upgrade
      # so the admin scaling API is not reset, so changing this alone does
      # nothing to an AppDefinition that already exists - patch the live
      # resource too.
      minInstances: 30
      # image and landingPage.label now come from appDefinitions.catalog.
# Reap a workspace this long after its last session. Default is 14 days.
theia-workspace-garbage-collector:
  enabled: true
  env:
    WORKSPACE_TTL: "1209600s"

# Scraped by the cluster's PodMonitors. On by default; stated so it is a
# decision rather than an accident.
monitoring:
  enabled: true
