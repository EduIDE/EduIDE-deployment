apiVersion: eduide.dev/v1
kind: Environment
metadata:
  name: staging
  displayName: Artemis Online IDE (Staging)
  tier: staging
spec:
  cluster: tum-student
  namespace: theia-staging

  platform:
    chartVersion: 1.0.0-rc0
    channel: main

  hosts:
    baseHost: artemis.cit.tum.de
    landing: theia-staging
    wildcardPrefixes: ["*.webview."]

  gateway:
    mode: shared
    # Note: NOT the landing host name; the shared Gateway uses "staging".
    listenerPrefix: staging

  keycloak:
    realm: Test
    clientId: theia-staging

  branding:
    appName: Artemis Online IDE (Staging)
    infoTitle: Welcome to EduIDE Cloud (Staging)
    footerVersion: Staging-v1.0.0

  values:
    theia-appdefinitions:
      defaultImageTag: latest
