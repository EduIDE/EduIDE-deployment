# Helm values for the staging environment.
#
# A plain values file. The deploy runs:
#   helm upgrade --install eduide ... -f environments/_base.yaml -f this file
#
# _base.yaml carries what is identical everywhere; this file carries what is
# not. Anything appearing here for more than one environment belongs in
# _base.yaml instead.
#
# Deployment metadata - which cluster, which namespace, which chart version -
# is in env.yaml next door, because it configures the deploy rather than the
# chart.

theia-certificates:
  hosts:
    configuration:
      baseHost: eduide.student.k8s.aet.cit.tum.de
      service: service.staging
      landing: staging
      instance: instance.staging
theia-cloud:
  app:
    name: Artemis Online IDE (Staging)
  gateway:
    parentRefs:
    - name: theia-shared-gateway
      namespace: gateway-system
      sectionName: staging-landing
    - name: theia-shared-gateway
      namespace: gateway-system
      sectionName: staging-service
    - name: theia-shared-gateway
      namespace: gateway-system
      sectionName: staging-instances
    - name: theia-shared-gateway
      namespace: gateway-system
      sectionName: staging-webview
  operator:
    image: ghcr.io/eduide/eduide-cloud/operator:latest
  landingPage:
    footerLinks:
      attribution:
        version: Staging-v1.0.0
    infoTitle: Welcome to EduIDE Cloud (Staging)
    image: ghcr.io/eduide/eduidec-landing-page:latest
  hosts:
    configuration:
      baseHost: eduide.student.k8s.aet.cit.tum.de
      service: service.staging
      landing: staging
      instance: instance.staging
    allWildcardInstances:
    - '*.webview.'
  keycloak:
    enable: true
    authUrl: https://keycloak-test.aet.cit.tum.de/
    realm: tum
    clientId: eduide
  service:
    image: ghcr.io/eduide/eduide-cloud/service:latest
  preloading:
    images:
    - ghcr.io/eduide/eduidec-landing-page:latest
    - ghcr.io/eduide/eduide/java-17:latest
    - ghcr.io/eduide/eduide/java-17-templates:latest
    - ghcr.io/eduide/eduide/c:latest
    - ghcr.io/eduide/eduide/c-templates:latest
    - ghcr.io/eduide/eduide/javascript:latest
    - ghcr.io/eduide/eduide/ocaml:latest
    - ghcr.io/eduide/eduide/rust:latest
    - ghcr.io/eduide/eduide/python:latest
    - image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
      args:
      - --version
theia-appdefinitions:
  defaultImageTag: latest
