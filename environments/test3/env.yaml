apiVersion: eduide.dev/v1
kind: Environment
metadata:
  name: test3
  displayName: Artemis Online IDE (Test3)
  tier: test
spec:
  cluster: parma
  namespace: test3

  platform:
    chartVersion: 1.0.0-rc0
    channel: main

  hosts:
    baseHost: theia-test.artemis.cit.tum.de
    landing: test3
    wildcardPrefixes: ["*.webview."]

  gateway:
    mode: shared
    listenerPrefix: test3

  keycloak:
    realm: Test
    clientId: theia-test

  branding:
    appName: Artemis Online IDE (Test3)
    infoTitle: 🚀 Welcome to EduIDE Cloud (Test3)
    footerVersion: Test3-v1.0.0

  values:
    theia-cloud:
      landingPage:
        loadingText: "⚡ Setting up your development workspace..."
