apiVersion: eduide.dev/v1
kind: Environment
metadata:
  name: test3
  displayName: Artemis Online IDE (Test3)
  tier: test
spec:
  # Evidence says aet-stud, not parma, despite the old values file commenting
  # "Test3 runs on the parma cluster": deployments/shared-gateway/values.yaml
  # (the aet-stud Gateway) defines the test3-landing/-service/-instances/-webview
  # listeners, and test3 attaches to them by sectionName. An HTTPRoute can only
  # attach to a Gateway in its own cluster, so test3 is on aet-stud.
  # The longhorn storage class below is the one thing that pointed at parma; it
  # is kept as an override because that is what test3 actually uses.
  cluster: aet-stud
  namespace: test3

  platform:
    chartVersion: 1.0.0-rc0
    channel: main

  hosts:
    baseHost: theia-test.artemis.cit.tum.de
    landing: test3
    wildcardPrefixes: ["*.webview."]

  gateway:
    mode: shared
    listenerPrefix: test3

  keycloak:
    realm: Test
    clientId: theia-test

  branding:
    appName: Artemis Online IDE (Test3)
    infoTitle: 🚀 Welcome to EduIDE Cloud (Test3)
    footerVersion: Test3-v1.0.0

  values:
    theia-cloud:
      operator:
        storageClassName: longhorn
      landingPage:
        loadingText: "⚡ Setting up your development workspace..."
