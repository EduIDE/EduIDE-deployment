# Helm values for the test2 environment.
#
# A plain values file. The deploy runs:
#   helm upgrade --install eduide ... -f environments/_base.yaml -f this file
#
# _base.yaml carries what is identical everywhere; this file carries what is
# not. Anything appearing here for more than one environment belongs in
# _base.yaml instead.
#
# Deployment metadata - which cluster, which namespace, which chart version -
# is in env.yaml next door, because it configures the deploy rather than the
# chart.

app:
  name: Artemis Online IDE (Test2)
gateway:
  parentRefs:
  - name: theia-shared-gateway
    namespace: eduide-system
    sectionName: test2-landing
  - name: theia-shared-gateway
    namespace: eduide-system
    sectionName: test2-service
  - name: theia-shared-gateway
    namespace: eduide-system
    sectionName: test2-instances
  - name: theia-shared-gateway
    namespace: eduide-system
    sectionName: test2-webview
landingPage:
  footerLinks:
    attribution:
      version: Test2-v1.0.0
  infoTitle: Welcome to EduIDE Cloud (Test2)
hosts:
  # --- hostnames served by this installation (checked by test-deploy-logic.sh)
  #   test2.eduide.student.k8s.aet.cit.tum.de                      landing page
  #   service.test2.eduide.student.k8s.aet.cit.tum.de              REST service
  #   instance.test2.eduide.student.k8s.aet.cit.tum.de             session ingress
  #   *.webview.instance.test2.eduide.student.k8s.aet.cit.tum.de   session webviews
  # --- end hostnames
  configuration:
    baseHost: eduide.student.k8s.aet.cit.tum.de
    service: service.test2
    landing: test2
    instance: instance.test2
  allWildcardInstances:
  - '*.webview.'
keycloak:
  enable: true
  authUrl: https://keycloak-test.aet.cit.tum.de/
  realm: tum
  clientId: eduide
# TEMPORARY - security integration test (plans/2026-10-12-security-integration-test.md).
# Revert this block after the test.
eduide-shared-cache:
  # Disabled for this test: shared-cache #40 couples app code with new chart
  # templates not in the pinned 0.5.3 subchart, so it is validated standalone.
  enabled: false
# Exercise the activity-tracker fix (#140): ping every minute and let a session
# time out quickly, so a frozen lastActivity from a failed poll would delete it
# fast if the bug were still present.
monitor:
  activityTracker:
    interval: 1
# Lazy sessions (no prewarm) for this test. The eager/prewarm path injects the
# scorpio env (ARTEMIS_TOKEN/URL, GIT_URI) via the data-bridge, which is not
# reliably reaching scorpio's extension host, so autoclone and auth fail. Lazy
# sessions set SCORPIO_THEIA_ENV_STRATEGY="" and pass the env as pod env vars,
# which scorpio reads directly (ProcessEnvStrategy). Re-enable prewarm once the
# data-bridge eager-injection path is fixed.
operator:
  eagerStart: false
appDefinitions:
  defaults:
    timeout: 15
