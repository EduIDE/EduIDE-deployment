# Helm values for the test2 environment, on the Go control plane (EduIDE 3.x).
#
# A plain values file. The deploy runs:
#   helm upgrade --install eduide ... -f cluster-defaults.yaml \
#     -f environments/_base-go.yaml -f this file
#
# Storage class, node pool, Gateway class and the ACME contact come from
# clusters/tum-student.yaml. Image tags are the chart defaults (appVersion).
# Same shape as test3, connected to artemis-test2.artemis.cit.tum.de, without the
# pool scaler, prepull and tracing.

x-hosts: &hosts
  service: test2.eduide.student.k8s.aet.cit.tum.de
  instance: instance.test2.eduide.student.k8s.aet.cit.tum.de
  webview: webview.instance.test2.eduide.student.k8s.aet.cit.tum.de

x-gateway: &gateway
  name: eduide
  namespace: eduide-test2
  sectionName: ""
  # Only the HTTPS listeners: sessions and pages are never served on the ACME :80 listeners.
  port: 443

x-keycloak: &keycloak
  url: https://keycloak-test.aet.cit.tum.de/
  realm: tum
  clientId: eduide

# The Artemis editions get the repository URL with the VCS token (Artemis#14702).
templateDefaults:
  gitUriAllowCredentials: true

templates:
  # The landing page offers the standalone editions; Artemis links start the unlisted artemis editions below.
  java-17-standalone: {}
  java-25-standalone: {}
  java-17:
    pool: {minIdle: 1, maxInstances: 5}
  java-25: {}

eduide-control-plane:
  config:
    deployment: test2
    hosts: *hosts
    gateway: *gateway
    oidc:
      issuerURL: https://keycloak-test.aet.cit.tum.de/realms/tum
      clientIDs: [eduide]
      gatewayClientID: eduide
      # Admin panel: client role eduide-admin on client eduide in realm tum.
      admin: {rolePath: resource_access.eduide.roles, role: eduide-admin}
    admin:
      prometheusURL: http://rancher-monitoring-prometheus.cattle-monitoring-system:9090
    allowedHosts:
    - github.com
    - gitlab.com
    - codeberg.org
    # The Artemis test host of this environment (repository URLs and ARTEMIS_URL).
    - artemis-test2.artemis.cit.tum.de
  networkPolicy:
    monitoringNamespace: cattle-monitoring-system
    # stud uses public address ranges inside the cluster: nodes 131.159.88.0/24 and 2a09:80c0:88::/64,
    # pods 198.18.0.0/16, services 198.19.0.0/16. Artemis and Keycloak sit in 131.159.89.0/24, outside.
    sessionEgressExtraDeny: [131.159.88.0/24, 198.18.0.0/16, 198.19.0.0/16, "2a09:80c0:88::/64"]
  monitoring:
    podMonitor: {enabled: true}
    # stud routes EduIDE alerts through the AlertmanagerConfig in eduide-system (namespace matcher).
    rules: {enabled: true, extraLabels: {namespace: eduide-system}}
    # Bootstrap ships the boards (spec.controlPlaneDashboards).
    dashboard: {enabled: false}
  oidc:
    # Set, so Envoy Gateway does not discover them through the OIDC upstream.
    authorizationEndpoint: https://keycloak-test.aet.cit.tum.de/realms/tum/protocol/openid-connect/auth
    tokenEndpoint: https://keycloak-test.aet.cit.tum.de/realms/tum/protocol/openid-connect/token
    endSessionEndpoint: https://keycloak-test.aet.cit.tum.de/realms/tum/protocol/openid-connect/logout

eduide-landing-page:
  # Placeholders for test2 (the chart requires both).
  legal:
    imprint:
      url: https://example.org/imprint
    privacy:
      url: https://example.org/privacy
  host: test2.eduide.student.k8s.aet.cit.tum.de
  gateway: *gateway
  config:
    title: EduIDE test2
    keycloak: *keycloak
