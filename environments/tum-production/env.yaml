# How this environment is DEPLOYED. Chart configuration is in
# values.yaml next door, which is a plain Helm values file.
#
# Read by the deploy workflow, not by Helm.
apiVersion: eduide.dev/v1
kind: Environment
metadata:
  name: tum-production
  displayName: Artemis Online IDE
  tier: production
spec:
  cluster: tum-production
  namespace: eduide-tum-production
  platform:
    chartVersion: 2.0.0
    channel: release
