# Helm values for the mannheim environment.
#
# A plain values file. The deploy runs:
#   helm upgrade --install eduide ... -f environments/_base.yaml -f this file
#
# _base.yaml carries what is identical everywhere; this file carries what is
# not. Anything appearing here for more than one environment belongs in
# _base.yaml instead.
#
# Deployment metadata - which cluster, which namespace, which chart version -
# is in env.yaml next door, because it configures the deploy rather than the
# chart.

theia-certificates:
  hosts:
    configuration:
      baseHost: eduide.aet.cit.tum.de
      service: service.mannheim
      landing: mannheim
      instance: instance.mannheim
theia-cloud:
  app:
    name: EduIDE Mannheim
  gateway:
    parentRefs:
    - name: theia-shared-gateway
      namespace: gateway-system
      sectionName: mannheim-landing
    - name: theia-shared-gateway
      namespace: gateway-system
      sectionName: mannheim-service
    - name: theia-shared-gateway
      namespace: gateway-system
      sectionName: mannheim-instances
    - name: theia-shared-gateway
      namespace: gateway-system
      sectionName: mannheim-webview
  operator:
    image: ghcr.io/eduide/eduide-cloud/operator:1.0.0-rc0
  landingPage:
    infoTitle: Welcome to EduIDE (Mannheim)
    image: ghcr.io/eduide/eduidec-landing-page:1.0.0-rc0
    footerLinks:
      attribution:
        version: Mannheim-v1.0.0
  hosts:
    configuration:
      baseHost: eduide.aet.cit.tum.de
      service: service.mannheim
      landing: mannheim
      instance: instance.mannheim
    allWildcardInstances:
    - '*.webview.'
  keycloak:
    enable: true
    authUrl: https://keycloak.aet.cit.tum.de/
    realm: REALM-TBD-mannheim
    clientId: eduide
  service:
    image: ghcr.io/eduide/eduide-cloud/service:1.0.0-rc0
  preloading:
    images:
    - ghcr.io/eduide/eduidec-landing-page:1.0.0-rc0
    - ghcr.io/eduide/eduide/java-17:1.0.0-rc0
    - ghcr.io/eduide/eduide/java-17-templates:1.0.0-rc0
    - ghcr.io/eduide/eduide/c:1.0.0-rc0
    - ghcr.io/eduide/eduide/c-templates:1.0.0-rc0
    - ghcr.io/eduide/eduide/javascript:1.0.0-rc0
    - ghcr.io/eduide/eduide/ocaml:1.0.0-rc0
    - ghcr.io/eduide/eduide/rust:1.0.0-rc0
    - ghcr.io/eduide/eduide/python:1.0.0-rc0
    - image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
      args:
      - --version
