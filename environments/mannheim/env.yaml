apiVersion: eduide.dev/v1
kind: Environment
metadata:
  name: mannheim
  displayName: EduIDE Mannheim
  tier: production
spec:
  # NOT YET PROVISIONED. The eduide cluster does not exist yet, so a deploy
  # stops at the cluster identity check. This file exists so the configuration
  # can be reviewed and agreed before anything is stood up.
  cluster: eduide
  namespace: mannheim

  platform:
    chartVersion: 1.0.0-rc0
    channel: release

  hosts:
    baseHost: eduide.uni-mannheim.de
    landing: eduide
    wildcardPrefixes: ["*.webview."]

  gateway:
    mode: shared
    listenerPrefix: mannheim

  # Each university runs its own Keycloak. Confirm all four values with them
  # before the first deploy: a wrong authUrl or clientId fails at login, not at
  # deploy, so nothing here catches it.
  keycloak:
    authUrl: https://login.uni-mannheim.de/auth/
    realm: eduide
    clientId: eduide-mannheim
    adminGroup: /eduide/admin

  branding:
    appName: EduIDE Mannheim
    infoTitle: Welcome to EduIDE (Mannheim)

  imageTag: "1.0.0-rc0"
