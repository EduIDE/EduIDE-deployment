apiVersion: eduide.dev/v1
kind: Environment
metadata:
  name: bonn
  displayName: EduIDE Bonn
  tier: production
spec:
  # NOT YET PROVISIONED. The eduide cluster does not exist yet, so a deploy
  # stops at the cluster identity check. This file exists so the configuration
  # can be reviewed and agreed before anything is stood up.
  cluster: eduide
  namespace: bonn

  platform:
    chartVersion: 1.0.0-rc0
    channel: release

  hosts:
    baseHost: eduide.uni-bonn.de
    landing: eduide
    wildcardPrefixes: ["*.webview."]

  gateway:
    mode: shared
    listenerPrefix: bonn

  # Each university brings its own realm and client. Confirm with them before
  # the first deploy; a wrong clientId fails at login, not at deploy.
  keycloak:
    realm: EduIDE
    clientId: eduide-bonn

  branding:
    appName: EduIDE Bonn
    infoTitle: Welcome to EduIDE (Bonn)

  imageTag: "1.0.0-rc0"
