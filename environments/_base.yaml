# Values identical in every environment.
#
# Derived mechanically: these are the keys that had the same value in all five
# of the old deployments/*/values.yaml files. Anything that varied lives in an
# environment's env.yaml instead. If you find yourself editing this file for one
# environment, it belongs in that environment's `values:` block.
#
# Host names, gateway routing and the image set are per environment and live
# in that environment's values.yaml.

imagePullPolicy: Always
app:
  id: nJV3nKZmpxTD4wu2
demoApplication:
  install: false
issuer:
  email: ls1.itg@in.tum.de
gateway:
  enabled: true
  create: false
  routes:
    enabled: true
  className: envoy
  name: theia-cloud-gateway
  serviceRouteRequestTimeout: 60s
monitor:
  enable: true
  activityTracker:
    enable: true
    interval: 3
operator:
  sentry:
    enable: true
  # These three were defaults of the theia-cloud-combined umbrella, not of any
  # environment values file, so deriving _base.yaml from the environments missed
  # them and the new chart defaults them differently. Carried forward
  # explicitly:
  #
  #   sessionsPerUser  the chart defaults to 1; every installation has run 10
  #   eagerStart       pre-starts the minInstances warm pool. Without it the
  #                    pool is not filled and the first student waits for a cold
  #                    multi-gigabyte pull
  sessionsPerUser: 10
  eagerStart: true

landingPage:
  ephemeralStorage: true
  appDefinition: java-17-templates-latest
  infoText: ' '
  loadingText: Preparing your personal Online IDE...
  logoFileExtension: png
  sentry:
    enable: true
  footerLinks:
    attribution:
      text: Built by TUM AET Research Group 👨‍💻
      url: https://aet.cit.tum.de/
    bugReport:
      text: Report a bug 🐛
      url: https://github.com/EduIDE/EduIDE/issues
    featureRequest:
      text: Request a feature ✨
      url: https://github.com/EduIDE/EduIDE/issues
    about:
      text: About
      url: https://aet.cit.tum.de/
service:
  # Public spam-mitigation token shared with the landing page, not a secret.
  # Same value the installations have always used; changing it gains nothing.
  authToken: nJV3nKZmpxTD4wu2
  adminApiTokenSecret:
    create: true
