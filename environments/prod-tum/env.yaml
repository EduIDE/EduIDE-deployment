apiVersion: eduide.dev/v1
kind: Environment
metadata:
  name: prod-tum
  displayName: Artemis Online IDE
  tier: production
spec:
  cluster: prod-tum
  namespace: theia

  platform:
    chartVersion: 1.0.0-rc0
    channel: release

  hosts:
    baseHost: artemis.cit.tum.de
    landing: theia
    wildcardPrefixes: ["*.webview."]

  gateway:
    mode: shared
    # Note: NOT the landing host name; the shared Gateway uses "prod".
    listenerPrefix: prod

  keycloak:
    realm: tum
    clientId: theia

  branding:
    appName: Artemis Online IDE
    infoTitle: Welcome to EduIDE Cloud
    footerVersion: v1.1.0

  # Production deliberately does not offer or preload the C templates image.
  preloadApps:
    - java-17
    - java-17-templates
    - c
    - javascript
    - ocaml
    - rust
    - python

  # Production pins one tag for every image it runs.
  imageTag: "1.1.0"

  values:
    theia-cloud:
      operator:
        replicas: 3
      landingPage:
        sentry:
          enable: false
    theia-appdefinitions:
      defaultImageTag: "1.1.0"
