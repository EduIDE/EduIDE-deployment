apiVersion: eduide.dev/v1
kind: Environment
metadata:
  name: e2e-test
  displayName: EduIDE end-to-end test target
  tier: test
spec:
  # Exists so the functional tests have somewhere to run that no human is
  # using. Deployed automatically from main, and the test suite runs against it
  # immediately afterwards. Do not point manual work at it: a failing test here
  # should mean the code is broken, not that somebody was mid-experiment.
  cluster: tum-student
  namespace: e2e-test

  platform:
    chartVersion: 1.0.0-rc0
    channel: main

  hosts:
    baseHost: theia-test.artemis.cit.tum.de
    landing: e2e
    wildcardPrefixes: ["*.webview."]

  gateway:
    mode: shared
    listenerPrefix: e2e

  keycloak:
    realm: Test
    clientId: theia-test

  branding:
    appName: Artemis Online IDE (E2E)
    infoTitle: Welcome to EduIDE Cloud (E2E test target)
    footerVersion: E2E

  values:
    theia-cloud:
      operator:
        # The suite shares one Keycloak account across virtual users, so this
        # caps how much it can start.
        sessionsPerUser: 50
