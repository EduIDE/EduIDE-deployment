# Helm values for the test3 environment.
#
# A plain values file. The deploy runs:
#   helm upgrade --install eduide ... -f environments/_base.yaml -f this file
#
# _base.yaml carries what is identical everywhere; this file carries what is
# not. Anything appearing here for more than one environment belongs in
# _base.yaml instead.
#
# Deployment metadata - which cluster, which namespace, which chart version -
# is in env.yaml next door, because it configures the deploy rather than the
# chart.

app:
  name: Artemis Online IDE (Test3)
gateway:
  parentRefs:
  - name: theia-shared-gateway
    namespace: eduide-system
    sectionName: test3-landing
  - name: theia-shared-gateway
    namespace: eduide-system
    sectionName: test3-service
  - name: theia-shared-gateway
    namespace: eduide-system
    sectionName: test3-instances
  - name: theia-shared-gateway
    namespace: eduide-system
    sectionName: test3-webview
landingPage:
  # Artemis links from this host start the IDE without a Launch click.
  trustedArtemisHosts:
    - artemis-test3.artemis.cit.tum.de
  loadingText: ⚡ Setting up your development workspace...
  infoTitle: 🚀 Welcome to EduIDE Cloud (Test3)
hosts:
  # --- hostnames served by this installation (checked by test-deploy-logic.sh)
  #   test3.eduide.student.k8s.aet.cit.tum.de                      landing page
  #   service.test3.eduide.student.k8s.aet.cit.tum.de              REST service
  #   instance.test3.eduide.student.k8s.aet.cit.tum.de             session ingress
  #   *.webview.instance.test3.eduide.student.k8s.aet.cit.tum.de   session webviews
  # --- end hostnames
  configuration:
    baseHost: eduide.student.k8s.aet.cit.tum.de
    service: service.test3
    landing: test3
    instance: instance.test3
  allWildcardInstances:
  - '*.webview.'
keycloak:
  enable: true
  authUrl: https://keycloak-test.aet.cit.tum.de/
  realm: tum
  clientId: eduide
eduide-shared-cache:
  enabled: true

# ---------------------------------------------------------------------------
# Applications
# ---------------------------------------------------------------------------
# Test environments offer Java 17 and Java 25 only. Picked from the chart's
# appDefinitions.catalog; needs chart 2.7.0 or later, older charts ignore it.
appDefinitions:
  enabled:
    - java-17-latest
    - java-17-templates-latest
    - java-25-latest
    - java-25-templates-latest
