hosts:
  configuration:
    &hostsConfig # This is a YAML anchor for reusability and readability
    baseHost: artemis.cit.tum.de
    service: service.theia-staging
    landing: theia-staging
    instance: instance.theia-staging

theia-certificates:
  hosts:
    configuration: *hostsConfig
  certificates:
    enabled: false
  wildcardTLSSecret:
    enabled: false
  adminApiTokenSecret:
    enabled: true

eduide-shared-cache:
  enabled: true
  auth:
    enabled: false

  cache:
    maxEntrySizeMB: 100
    verifyCASHash: true

  staticAnalysis:
    enabled: false
    checkNetwork: true
    checkExec: true
    checkReflection: true
    checkFilesystem: true

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  monitoring:
    enabled: true

  reposilite:
    fullnameOverride: eduide-shared-cache-reposilite

  gateway:
    enabled: true
    parentRefs:
      cache:
        - name: theia-shared-gateway
          namespace: gateway-system
          sectionName: staging-cache
      repo:
        - name: theia-shared-gateway
          namespace: gateway-system
          sectionName: staging-repo
    cache:
      hostname: cache.staging.theia-test.artemis.cit.tum.de
    repo:
      hostname: repo.staging.theia-test.artemis.cit.tum.de


theia-cloud:
  app:
    id: nJV3nKZmpxTD4wu2
    name: Artemis Online IDE (Staging)

  issuer:
    email: ls1.itg@in.tum.de

  hosts:
    configuration: *hostsConfig
    allWildcardInstances: ["*.webview."]

  gateway:
    enabled: true
    create: false
    routes:
      enabled: true
    className: envoy
    name: theia-cloud-gateway
    parentRefs:
      - name: theia-shared-gateway
        namespace: gateway-system
        sectionName: staging-landing
      - name: theia-shared-gateway
        namespace: gateway-system
        sectionName: staging-service
      - name: theia-shared-gateway
        namespace: gateway-system
        sectionName: staging-instances
      - name: theia-shared-gateway
        namespace: gateway-system
        sectionName: staging-webview
    serviceRouteRequestTimeout: "60s"

  monitor:
    enable: true
    activityTracker:
      enable: true
      interval: 3

  operator:
    image: ghcr.io/eduide/eduide-cloud/operator:latest
    sentry:
      enable: true
    #eagerStart: false
    replicas: 1
    sessionsPerUser: 10
    storageClassName: csi-rbd-sc
    buildCache:
      enabled: true
      gradleUrl: "https://cache.staging.theia-test.artemis.cit.tum.de/gradle/"
      bazelUrl: "https://cache.staging.theia-test.artemis.cit.tum.de/bazel/"
      enablePush: true
    dependencyCache:
      enabled: true
      url: "https://repo.staging.theia-test.artemis.cit.tum.de/releases/"

  service:
    image: ghcr.io/eduide/eduide-cloud/service:latest
    sentry:
      enable: true
    adminApiTokenSecret:
      name: service-admin-api-token
      key: ADMIN_API_TOKEN

  # Preload list indices 0–12 must match deploy-theia.yml --set overrides when tags are passed.
  # Index 13 is oauth2-proxy (distroless); the workflow does not override it.
  preloading:
    images:
      - ghcr.io/eduide/eduidec-landing-page:latest
      - ghcr.io/eduide/eduide/java-17:latest
      - ghcr.io/eduide/eduide/java-17-templates:latest
      - ghcr.io/eduide/eduide/c:latest
      - ghcr.io/eduide/eduide/c-templates:latest
      - ghcr.io/eduide/eduide/javascript:latest
      - ghcr.io/eduide/eduide/ocaml:latest
      - ghcr.io/eduide/eduide/rust:latest
      - ghcr.io/eduide/eduide/python:latest
      - ghcr.io/eduide/eduide/java-17-no-ls:latest
      - ghcr.io/eduide/eduide/rust-no-ls:latest
      - ghcr.io/eduide/eduide/langserver-java:latest
      - ghcr.io/eduide/eduide/langserver-rust:latest
      - image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
        args: ["--version"]

  imagePullPolicy: Always

  # Do not install demoApplication
  demoApplication:
    install: false

  landingPage:
    # We use the try now page as landing page since the default does not support mutliple apps -> https://github.com/eclipsesource/theia-cloud/discussions/301
    image: ghcr.io/eduide/eduidec-landing-page:latest
    sentry:
      enable: true
    logoFileExtension: "png"
    # We can define a default blueprint
    appDefinition: "java-17-templates-latest"
    ephemeralStorage: true
    additionalApps:
      java-17-latest:
        label: Java 17
        visible: false
      java-17-templates-latest:
        label: Java 17
        buildSystems:
          - id: maven
            label: Maven
          - id: gradle
            label: Gradle
      c-latest:
        label: C
        visible: false
      c-templates-latest:
        label: C
        buildSystems:
          - id: bazel
            label: Bazel
          - id: make
            label: Make
      javascript-latest:
        label: Javascript
      ocaml-latest:
        label: Ocaml
      python-latest:
        label: Python
      rust-latest:
        label: Rust
    infoTitle: "Welcome to EduIDE Cloud (Staging)"
    infoText: " "
    loadingText: "Preparing your personal Online IDE..."
    footerLinks:
      attribution:
        text: "Built by TUM AET Research Group 👨‍💻"
        url: "https://aet.cit.tum.de/"
        version: "Staging-v1.0.0"
      bugReport:
        text: "Report a bug 🐛"
        url: "https://github.com/EduIDE/EduIDE/issues"
      featureRequest:
        text: "Request a feature ✨"
        url: "https://github.com/EduIDE/EduIDE/issues"
      about:
        text: "About"
        url: "https://aet.cit.tum.de/"


  keycloak:
    enable: true

    # -- Key cloak auth URL. Only has to be specified when enable: true
    authUrl: "https://keycloak.aet.cit.tum.de/"

    # -- The Keycloak Realm. Only has to be specified when enable: true
    realm: "Test"

    # -- The client-id. Only has to be specified when enable: true
    clientId: "theia-staging"

theia-appdefinitions:
  defaultImageTag: "latest"

monitoring:
  targetNamespaces:
    - theia-staging
  sessionNamespaces:
    - theia-staging
