hosts:
  configuration:
    &hostsConfig # This is a YAML anchor for reusability and readability
    baseHost: theia-test.artemis.cit.tum.de
    service: service.test2
    landing: test2
    instance: instance.test2

theia-certificates:
  hosts:
    configuration: *hostsConfig
  certificates:
    enabled: false
  wildcardTLSSecret:
    enabled: false
  adminApiTokenSecret:
    enabled: true

eduide-shared-cache:
  enabled: true
  auth:
    enabled: false

  cache:
    maxEntrySizeMB: 100
    verifyCASHash: true

  tls:
    enabled: false
    secretName: cache-internal-cert-secret

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  monitoring:
    enabled: true

  reposilite:
    fullnameOverride: eduide-shared-cache-reposilite

  gateway:
    enabled: true
    parentRefs:
      cache:
        - name: theia-shared-gateway
          namespace: gateway-system
          sectionName: test2-cache
      repo:
        - name: theia-shared-gateway
          namespace: gateway-system
          sectionName: test2-repo
    cache:
      hostname: cache.test2.theia-test.artemis.cit.tum.de
    repo:
      hostname: repo.test2.theia-test.artemis.cit.tum.de


theia-cloud:
  app:
    id: nJV3nKZmpxTD4wu2
    name: Artemis Online IDE (Test2)

  issuer:
    email: ls1.itg@in.tum.de

  hosts:
    configuration: *hostsConfig
    allWildcardInstances: ["*.webview."]

  gateway:
    enabled: true
    create: false
    routes:
      enabled: true
    className: envoy
    name: theia-cloud-gateway
    parentRefs:
      - name: theia-shared-gateway
        namespace: gateway-system
        sectionName: test2-landing
      - name: theia-shared-gateway
        namespace: gateway-system
        sectionName: test2-service
      - name: theia-shared-gateway
        namespace: gateway-system
        sectionName: test2-instances
      - name: theia-shared-gateway
        namespace: gateway-system
        sectionName: test2-webview
    instancesRouteName: "theia-cloud-demo-ws-route"
    serviceRouteRequestTimeout: "60s"

  monitor:
    enable: true
    activityTracker:
      enable: true
      interval: 3

  operator:
    image: ghcr.io/eduide/eduide-cloud/operator:pr-114
    sentry:
      enable: true
    #eagerStart: false
    replicas: 1
    sessionsPerUser: 10
    storageClassName: csi-rbd-sc
    buildCache:
      enabled: true
      gradleUrl: "https://cache.test2.theia-test.artemis.cit.tum.de/gradle/"
      bazelUrl: "https://cache.test2.theia-test.artemis.cit.tum.de/bazel/"
      enablePush: true
    dependencyCache:
      enabled: true
      url: "http://repo.test2.theia-test.artemis.cit.tum.de/releases/"


  # service:
  #   image: ghcr.io/eduide/eduide-cloud/service:latest
  #   adminApiTokenSecret:
  #     name: service-admin-api-token
  #     key: ADMIN_API_TOKEN

  # Preload list indices 0–11 must match deploy-theia.yml --set overrides when tags are passed.
  # Index 12 is oauth2-proxy (distroless); the workflow does not override it.
  preloading:
    images:
      - ghcr.io/eduide/eduidec-landing-page:latest
      - ghcr.io/eduide/eduide/java-17:latest
      - ghcr.io/eduide/eduide/java-17-templates:latest
      - ghcr.io/eduide/eduide/c:latest
      - ghcr.io/eduide/eduide/c-templates:latest
      - ghcr.io/eduide/eduide/javascript:latest
      - ghcr.io/eduide/eduide/ocaml:latest
      - ghcr.io/eduide/eduide/rust:latest
      - ghcr.io/eduide/eduide/python:latest
      - ghcr.io/eduide/eduide/java-17-no-ls:latest
      - ghcr.io/eduide/eduide/rust-no-ls:latest
      - ghcr.io/eduide/eduide/langserver-java:latest
      - ghcr.io/eduide/eduide/langserver-rust:latest
      - image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
        args: ["--version"]

  imagePullPolicy: Always

  # Do not install demoApplication
  demoApplication:
    install: false

  landingPage:
    # We use the try now page as landing page since the default does not support multiple apps -> https://github.com/eclipsesource/theia-cloud/discussions/301
    image: ghcr.io/eduide/eduidec-landing-page
    sentry:
      enable: true
    # We can define a default blueprint
    appDefinition: "java-17-templates-latest"
    ephemeralStorage: true
    additionalApps:
      java-17-latest:
        label: Java 17
        visible: false
      java-17-templates-latest:
        label: Java 17
        buildSystems:
          - id: gradle
            label: Gradle
          - id: maven
            label: Maven
      c-latest:
        label: C
        visible: false
      c-templates-latest:
        label: C
        buildSystems:
          - id: bazel
            label: Bazel
          - id: make
            label: Make
      javascript-latest:
        label: Javascript
      ocaml-latest:
        label: Ocaml
      python-latest:
        label: Python
      rust-latest:
        label: Rust
    infoTitle: "Welcome to EduIDE Cloud (Test2)"
    infoText: " "  
    loadingText: "Preparing your personal Online IDE..."
    footerLinks:
      attribution:
        text: "Built by TUM AET Research Group 👨‍💻"
        url: "https://aet.cit.tum.de/"
        version: "Test2-v1.0.0"
      bugReport:
        text: "Report a bug 🐛"
        url: "https://github.com/EduIDE/EduIDE/issues"
      featureRequest:
        text: "Request a feature ✨"
        url: "https://github.com/EduIDE/EduIDE/issues"
      about:
        text: "About"
        url: "https://aet.cit.tum.de/"


  keycloak:
    enable: true

    # -- Key cloak auth URL. Only has to be specified when enable: true
    authUrl: "https://keycloak.ase.in.tum.de/"

    # -- The Keycloak Realm. Only has to be specified when enable: true
    realm: "Test"

    # -- The client-id. Only has to be specified when enable: true
    clientId: "theia-test"

monitoring:
  targetNamespaces:
    - test2
  sessionNamespaces:
    - test2
